<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabedelo Entrance 3D</title>
<style>
  :root { --bg:#dfe9f2; --panel:rgba(255,255,255,.88); --ink:#1d2430; --muted:#5a6575; --accent:#2f6fb3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel:rgba(24,28,36,.88); --ink:#e8edf4; --muted:#9aa6b6; --accent:#7fb0ea; } }
  :root[data-theme="dark"] { --panel:rgba(24,28,36,.88); --ink:#e8edf4; --muted:#9aa6b6; --accent:#7fb0ea; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font:14px/1.4 -apple-system, system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; }
  #hud { position:absolute; top:12px; left:12px; max-width:min(360px, calc(100vw - 48px)); background:var(--panel); padding:10px 12px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  #hud h1 { font-size:15px; margin:0 0 4px; }
  #hud p { margin:4px 0; color:var(--muted); font-size:12.5px; }
  #hud button { margin:4px 4px 0 0; padding:5px 9px; border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:6px; cursor:pointer; font-size:12.5px; }
  #hud button.on { background:var(--accent); color:#fff; }
  body.shot #hud { display:none; }
</style>
</head>
<body>
<div id="hud">
  <h1>Moradia do Cabedelo: entrada</h1>
  <p>Approximate massing model from the 2023 licensing drawings (plans F08, elevations F09). Drag to rotate, scroll to zoom, right-drag to pan.</p>
  <div>
    <button data-v="star1" class="on">Star 1 (level with the cars)</button>
    <button data-v="star2">Star 2 (nearer the street)</button>
    <button data-v="street">From the street</button>
    <button data-v="bird">Bird's-eye (blue area)</button>
  </div>
  <div><button id="wallBtn">Show right boundary wall</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Site coordinates: X along the street (m, 0 = left boundary), Y into the plot (m, 0 = street boundary),
// H = absolute level (m) as on the drawings. Three.js: (X, H - BASE, -Y).
const BASE = 7.0;
const P = (x, y, h) => new THREE.Vector3(x, h - BASE, -y);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ee);
scene.fog = new THREE.Fog(0xcfe0ee, 45, 110);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 300);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xeef4ff, 0x8a8a70, 0.75));
const sun = new THREE.DirectionalLight(0xfff3e0, 0.95);
sun.position.set(-8, 30, 22);
sun.target.position.set(10, 2, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
scene.add(sun, sun.target);

const M = (color, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, side: THREE.DoubleSide }, extra));
const mat = {
  render: M(0xe6d3b3), renderLight: M(0xf1e6d2), white: M(0xf3f1ec), concrete: M(0xb9b6ae),
  stone: M(0xd8d2c4), paving: M(0xa9a59c), grass: M(0x7fa05a), bed: M(0x6b8f45),
  roof: M(0xb5603e), glass: M(0x6f8fa8, { roughness: 0.15, metalness: 0.3, transparent: true, opacity: 0.75 }),
  guard: M(0xbcd7e6, { roughness: 0.1, transparent: true, opacity: 0.35 }),
  metal: M(0x3a3d42, { roughness: 0.5, metalness: 0.4 }), wood: M(0x8a5a36),
  road: M(0x55585c), sidewalk: M(0xc9c6bf), earth: M(0xa58e6e),
};
// Granite cubes, 6 × 7 cm with mortar joints, laid in a running bond. One texture tile covers CUBE_TILE metres.
const CUBE_TILE = 0.84;
{
  const S = 1008, cols = 12, rows = 14, cw = S / cols, ch = S / rows;   // 12 × 7 cm = 14 × 6 cm = 0.84 m
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#6f6d69'; g.fillRect(0, 0, S, S);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let r = 0; r < rows; r++) for (let k = -1; k < cols; k++) {
    const x = k * cw + (r % 2 ? cw / 2 : 0), v = 150 + Math.floor(rnd() * 55), t = Math.floor(rnd() * 12);
    g.fillStyle = `rgb(${v + t},${v + t},${v})`;
    g.fillRect(x + 3, r * ch + 3, cw - 6, ch - 6);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  mat.cubes = M(0xffffff, { map: tex, roughness: 0.95 });
}

// A block whose top may slope: corner heights h00 (x0,y0), h10 (x1,y0), h01 (x0,y1), h11 (x1,y1).
function prism(x0, x1, y0, y1, z0, h, topMat, sideMat = mat.concrete) {
  const [h00, h10, h01, h11] = typeof h === 'number' ? [h, h, h, h] : h;
  const t = [P(x0, y0, h00), P(x1, y0, h10), P(x1, y1, h11), P(x0, y1, h01)];
  const b = [P(x0, y0, z0), P(x1, y0, z0), P(x1, y1, z0), P(x0, y1, z0)];
  const quads = [[t[0], t[1], t[2], t[3]], [b[0], b[1], t[1], t[0]], [b[1], b[2], t[2], t[1]],
                 [b[2], b[3], t[3], t[2]], [b[3], b[0], t[0], t[3]], [b[3], b[2], b[1], b[0]]];
  const pos = [];
  for (const [a, c, d, e] of quads) for (const v of [a, c, d, a, d, e]) pos.push(v.x, v.y, v.z);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const uv = [];   // plan-projected, so textured tops tile at true scale
  for (let i = 0; i < pos.length; i += 3) uv.push(pos[i] / CUBE_TILE, -pos[i + 2] / CUBE_TILE);
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  g.addGroup(0, 6, 0); g.addGroup(6, 30, 1);
  const m = new THREE.Mesh(g, [topMat, sideMat]);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
const box = (x0, x1, y0, y1, z0, z1, m) => prism(x0, x1, y0, y1, z0, z1, m, m);

// Vertical slats between two points in plan, from z0 to z1, with a top rail.
function slats(xa, ya, xb, yb, z0, z1, m = mat.metal, gap = 0.12, w = 0.04) {
  const L = Math.hypot(xb - xa, yb - ya), n = Math.max(1, Math.round(L / gap));
  for (let i = 0; i <= n; i++) {
    const x = xa + (xb - xa) * i / n, y = ya + (yb - ya) * i / n;
    box(x - w / 2, x + w / 2, y - w / 2, y + w / 2, z0, z1, m);
  }
  const ux = (xb - xa) / L, uy = (yb - ya) / L;
  const r = new THREE.Mesh(new THREE.BoxGeometry(L, 0.05, 0.06), m);
  r.position.copy(P((xa + xb) / 2, (ya + yb) / 2, z1));
  r.rotation.y = Math.atan2(uy, ux);
  r.castShadow = true; scene.add(r);
}
function glassGuard(xa, ya, xb, yb, z0, z1) {
  const L = Math.hypot(xb - xa, yb - ya);
  const g = new THREE.Mesh(new THREE.BoxGeometry(L, z1 - z0, 0.02), mat.guard);
  g.position.copy(P((xa + xb) / 2, (ya + yb) / 2, (z0 + z1) / 2));
  g.rotation.y = Math.atan2(yb - ya, xb - xa);
  scene.add(g);
  slats(xa, ya, xb, yb, z1, z1 + 0.001, mat.metal, L);  // top rail only
}

// ---- Street ----
box(-8, 28, -14, -2.2, 8.9, 9.2, mat.road);
box(-8, 28, -2.2, 0, 8.9, 9.35, mat.sidewalk);

// ---- Ground, left side ----
const LAWN_Y = 17.1;
prism(0, 8.38, 0, 3.8, 7.0, [9.5, 9.45, 9.15, 9.15], mat.grass, mat.earth);
prism(0, 5.2, 3.8, LAWN_Y, 7.0, [9.15, 9.15, 7.45, 7.45], mat.grass, mat.earth);
prism(5.2, 6.21, 5.64, LAWN_Y, 7.0, [8.5, 8.5, 7.5, 7.5], mat.paving, mat.earth);   // side path to the back garden
prism(5.2, 6.21, 3.8, 5.64, 7.0, 8.5, mat.paving, mat.earth);
prism(0, 19.98, LAWN_Y, 26, 7.0, 7.4, mat.grass, mat.earth);
// Stairs from the entrance path down to the side path (curved on the drawings, simplified as straight).
for (let i = 0; i < 6; i++) {
  const xa = 8.38 - (i + 1) * (3.18 / 6), xb = 8.38 - i * (3.18 / 6);
  box(xa, xb, 3.8, 5.64, 7.0, 9.6 - i * 0.185, mat.stone);
}

// ---- Entrance path, stairs, landing (technical room underneath) ----
prism(8.38, 9.9, 0, 5.67, 7.0, [9.45, 9.45, 9.65, 9.65], mat.stone);
for (let i = 0; i < 5; i++) {
  const ya = 5.67 + i * 0.254;
  box(8.38, 9.9, ya, ya + 0.254, 7.0, 9.65 + (i + 1) * 0.16, mat.stone);
}
prism(8.38, 9.9, 6.94, 7.96, 7.78, 10.45, mat.stone, mat.render);
prism(6.21, 8.38, 5.64, 7.96, 7.78, 10.45, mat.stone, mat.render);   // zona técnica, roof = landing
// Door into the technical room, in its wall facing the front paving, next to the house front (0.80 m, at +7.78).
// Set slightly proud of the wall face (X = 9.9), leaf in front of the frame, so no faces are coplanar.
box(9.905, 9.925, 7.03, 7.99, 7.78, 9.98, mat.white);                    // frame
box(9.905, 9.94, 7.11, 7.91, 7.781, 9.88, mat.metal);                    // door leaf
slats(6.21, 5.64, 8.38, 5.64, 10.45, 11.45);
slats(6.21, 5.64, 6.21, 7.96, 10.45, 11.45);
slats(9.9, 5.67, 9.9, 7.96, 10.45, 11.45);

// ---- Front area (blue rectangle on the marked-up plan) ----
// One surface of 6×7 cm granite cubes following the driveway ramp: level at +9.20 for the first 0.8 m,
// a uniform slope down to +7.78, then level for the last metre in front of the house. The two red
// rectangles are gardens flush with the paving. A retaining wall with a guard separates it from the
// entrance path and stairs on the left, which stay at +9.45 to +10.45.
{
  const FX0 = 9.9, FX1 = 19.98, Y_FLAT = 0.8, Y_LOW = 6.92, H_TOP = 9.2, H_LOW = 7.78;
  const h = y => y <= Y_FLAT ? H_TOP : y >= Y_LOW ? H_LOW : H_TOP + (H_LOW - H_TOP) * (y - Y_FLAT) / (Y_LOW - Y_FLAT);
  // Splits [y0, y1] at the slope's break lines so each piece is planar.
  const surface = (x0, x1, y0, y1, m, lift = 0) => {
    const cuts = [y0, ...[Y_FLAT, Y_LOW].filter(c => c > y0 && c < y1), y1];
    for (let i = 0; i + 1 < cuts.length; i++) {
      const a = cuts[i], b = cuts[i + 1];
      prism(x0, x1, a, b, 7.0, [h(a) + lift, h(a) + lift, h(b) + lift, h(b) + lift], m);
    }
  };
  surface(FX0, FX1, 0, 7.96, mat.cubes);                                 // up to the house front
  // Gardens from the V2 markup.
  surface(10.95, 14.95, 0, 2.1, mat.bed, 0.02);                          // along the street wall
  surface(13.50, 14.77, 7.205, 7.955, mat.bed, 0.02);                    // small bed in the front-right corner of the house (walls at X 14.77, Y 7.96; 5 mm gap avoids flicker)
  surface(18.94, FX1, 0, 7.84, mat.bed, 0.02);                           // strip along the right boundary
}
glassGuard(9.9, 0.3, 9.9, 5.67, 9.55, 10.6);                             // guard on the retaining wall by the path

// ---- Covered parking at the lower floor (+7.78) ----
prism(14.77, 19.98, 7.96, LAWN_Y, 7.0, 7.78, mat.concrete);

// Carport roof (+10.28) on posts.
box(14.77, 19.98, 7.96, LAWN_Y, 10.03, 10.28, mat.white);
for (const y of [8.1, 12.5, 16.9]) box(19.55, 19.8, y - 0.12, y + 0.12, 7.78, 10.03, mat.white);

// Scale reference: a car in the covered parking.
{
  const car = M(0x5d7fa3, { roughness: 0.4, metalness: 0.3 });
  box(16.3, 18.1, 9.0, 13.3, 7.95, 8.75, car);
  box(16.45, 17.95, 9.9, 12.4, 8.75, 9.3, mat.glass);
  for (const [x, y] of [[16.3, 9.7], [18.1, 9.7], [16.3, 12.6], [18.1, 12.6]])
    box(x - 0.12, x + 0.12, y - 0.33, y + 0.33, 7.78, 8.4, mat.metal);
}

// ---- Boundary walls and gates ----
for (const [a, b] of [[0, 8.38], [9.9, 15.15], [18.62, 19.98]]) box(a, b, -0.2, 0, 9.2, 10.4, mat.white);
box(-0.2, 0, -0.2, 26, 7.0, 10.9, mat.white);
const rightWall = box(19.98, 20.18, -0.2, 26, 7.0, 11.0, mat.white);
// Neighbouring ground to the right, where the camera positions marked with stars stand.
prism(20.18, 28, -0.2, 26, 7.0, 9.0, mat.grass, mat.earth);
// The area marked with the blue rectangle, outlined on the ground.
{
  const pts = [[10.12, -0.05], [20.0, -0.05], [20.0, 7.87], [10.12, 7.87], [10.12, -0.05]].map(([x, y]) => P(x, y, 9.5));
  const area = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x1f5fd6 }));
  area.visible = false; scene.add(area); window.areaOutline = area;
}
slats(8.38, -0.1, 9.9, -0.1, 9.45, 10.35, mat.metal, 0.09, 0.05);
slats(15.15, -0.1, 18.62, -0.1, 9.25, 10.35, mat.metal, 0.09, 0.05);

// ---- House ----
const HX0 = 6.21, HX1 = 14.77, HY0 = 7.96, HY1 = 17.1;
box(HX0, HX1, HY0, HY1, 7.78, 10.51, mat.render);                       // lower floor
box(9.65, HX1, HY0, HY1, 10.51, 13.31, mat.render);                     // upper floor, right part
box(HX0, 9.65, 9.74, HY1, 10.51, 13.31, mat.render);                    // upper floor behind the porch
box(HX0, 9.65, HY0, 9.74, 10.40, 10.51, mat.stone);                     // porch floor
box(HX0, 9.65, HY0, 9.74, 13.11, 13.31, mat.render);                    // porch ceiling
box(HX0, HX0 + 0.2, HY0, 9.74, 10.51, 13.11, mat.render);               // porch side wall
box(HX0 + 0.2, 9.6, 9.70, 9.74, 10.51, 13.11, mat.renderLight);         // porch back wall
slats(HX0 + 0.2, HY0 + 0.05, 8.44, HY0 + 0.05, 10.51, 11.51, mat.white, 0.1, 0.05);
// Openings
box(9.6, 9.66, 8.35, 9.35, 10.51, 12.71, mat.wood);                     // front door, porch → hall
box(11.51, 12.87, HY0 - 0.03, HY0, 11.41, 12.48, mat.glass);            // hall window
box(11.0, 13.4, HY0 - 0.03, HY0, 7.80, 9.95, mat.glass);                // lower-floor glazing on the patio
box(7.2, 8.9, 9.66, 9.69, 10.51, 12.71, mat.glass);                     // suite glazing onto the porch
// Hipped roof: eaves +13.31 with 0.25 m overhang, ridge +15.38.
{
  const o = 0.25, x0 = HX0 - o, x1 = HX1 + o, y0 = HY0 - o, y1 = HY1 + o, he = 13.31, hr = 15.38;
  box(x0, x1, y0, y1, 13.16, he, mat.white);
  const xm = (x0 + x1) / 2, half = (x1 - x0) / 2, ry0 = y0 + half, ry1 = y1 - half;
  const c = [P(x0, y0, he), P(x1, y0, he), P(x1, y1, he), P(x0, y1, he)], r0 = P(xm, ry0, hr), r1 = P(xm, ry1, hr);
  const tris = [[c[0], c[1], r0], [c[1], c[2], r1], [c[1], r1, r0], [c[2], c[3], r1], [c[3], c[0], r0], [c[3], r0, r1]];
  const pos = []; for (const t of tris) for (const v of t) pos.push(v.x, v.y, v.z);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const roof = new THREE.Mesh(g, mat.roof); roof.castShadow = roof.receiveShadow = true; scene.add(roof);
  box(12.0, 12.45, 13.0, 13.45, 14.2, 15.8, mat.white);                 // chimney
}

// ---- Views ----
// Star positions from the marked-up plan: 2.5 m outside the right boundary, eye height 1.6 m above
// ground at about +9.0. The right boundary wall is hidden for them, since it would block the view.
const views = {
  star1:  { pos: [22.5, 9.3, 10.6], look: [14.0, 3.8, 8.9], fov: 68, wall: false },
  star2:  { pos: [22.5, 4.0, 10.6], look: [13.5, 4.6, 8.8], fov: 68, wall: false },
  street: { pos: [15.0, -9.0, 11.0], look: [14.5, 6.0, 9.0], fov: 55, wall: true },
  bird:   { pos: [27.0, -8.0, 24.0], look: [14.5, 5.0, 8.6], fov: 50, wall: true, area: true },
};
let wallOn = true;
function setWall(on) {
  wallOn = on; rightWall.visible = on;
  document.getElementById('wallBtn').textContent = on ? 'Hide right boundary wall' : 'Show right boundary wall';
}
function setView(k) {
  const v = views[k];
  camera.fov = v.fov; camera.updateProjectionMatrix();
  camera.position.copy(P(...v.pos)); controls.target.copy(P(...v.look)); controls.update();
  setWall(v.wall); areaOutline.visible = !!v.area;
  document.querySelectorAll('#hud button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === k));
}
document.querySelectorAll('#hud button[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
document.getElementById('wallBtn').onclick = () => setWall(!wallOn);
const params = new URLSearchParams(location.search);
if (params.has('shot')) document.body.classList.add('shot');
setView(params.get('view') || 'star1');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
if (params.has('shot')) {   // single frame for headless export, written into the page as a PNG data URL
  renderer.render(scene, camera);
  const out = document.createElement('pre'); out.id = 'png';
  out.textContent = renderer.domElement.toDataURL('image/png'); document.body.appendChild(out);
}
else (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
